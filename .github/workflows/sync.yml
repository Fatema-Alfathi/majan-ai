name: Sync tenders
# Pulls open tenders and saves the list. Vercel publishes that commit.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tenders
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node sync.mjs
      - name: Save the updated list
        run: |
          git add -- docs/tenders.json
          if git diff --cached --quiet; then
            echo "No tender changes to save."
            exit 0
          fi
          git -c user.name="Fatema-Alfathi" -c user.email="132199582+Fatema-Alfathi@users.noreply.github.com" commit -m "حدّث قائمة المناقصات المفتوحة."
          git push origin HEAD:master
