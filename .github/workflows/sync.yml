name: Sync tenders
# Pulls open tenders, then publishes the list.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-tenders
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node sync.mjs
      - name: Link the Vercel project
        working-directory: docs
        env:
          VERCEL_ORG_ID: team_DYOXCFBg8L0vU6KFMJdHsRX9
          VERCEL_PROJECT_ID: prj_prW1Te1Daeo57QsZwqhxzIDsEVo1
        run: |
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json
      - name: Publish the updated list
        working-directory: docs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN"
